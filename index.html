<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot Generator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons (Vanilla) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
        }
        .animate-in {
            animation: fadeIn 0.3s ease-out;
        }
        .animate-slide-in {
            animation: slideIn 0.3s ease-out;
        }
        .animate-pulse-slow {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONS ---
        const Icon = ({ name, className }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        // --- UI COMPONENTS ---
        const Button = ({ children, className, onClick, disabled }) => (
            <button 
                onClick={onClick} 
                disabled={disabled}
                className={`inline-flex items-center justify-center rounded-xl font-bold transition-all active:scale-95 disabled:opacity-50 disabled:pointer-events-none ${className}`}
            >
                {children}
            </button>
        );

        const Input = ({ value, onChange, placeholder, className }) => (
            <input 
                value={value} 
                onChange={onChange} 
                placeholder={placeholder}
                className={`flex w-full border bg-transparent px-3 py-1 shadow-sm transition-colors file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-slate-400 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-slate-900 disabled:cursor-not-allowed disabled:opacity-50 ${className}`}
            />
        );

        const Badge = ({ children, className }) => (
            <div className={`inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2 ${className}`}>
                {children}
            </div>
        );

        const Card = ({ children, className }) => (
            <div className={`rounded-3xl border bg-card text-card-foreground shadow-sm ${className}`}>
                {children}
            </div>
        );

        // --- DATA ---
        // NOTE: Images are referenced relatively. Ensure 'attached_assets' folder is in the same directory as this HTML file.
        const INITIAL_ITEMS = [
            { id: "1", name: "Strawberry Elephant", rarity: "OG Tier (Rarest)", image: "../attached_assets/download_1764776603487.jpeg", count: 0 },
            { id: "2", name: "Dragon Cannelloni", rarity: "Secret/OG", image: "../attached_assets/download_(3)_1764776603390.jpeg", count: 0 },
            { id: "3", name: "Chillin Chili", rarity: "Event Exclusive", image: "../attached_assets/download_(4)_1764776603284.jpeg", count: 0 },
            { id: "4", name: "Esok Sekolah", rarity: "Secret", image: "../attached_assets/download_(5)_1764776603741.jpeg", count: 0 },
            { id: "5", name: "Garama & Madundung", rarity: "Secret", image: "../attached_assets/download_(6)_1764776603595.jpeg", count: 0 },
        ];

        const FAKE_USERS = [
            "Level10Gyatt", "SkibidiRizzler", "FanumTaxCollector", "GrimaceShakeOwO",
            "SigmaGrindset", "OhioFinalBoss", "KaiCenatFan99", "SpeedShowMeat",
            "AmbatukamOmygot", "LivvyDunneRizz", "BabyGronkSimp", "LooksmaxerPro"
        ];

        const FAKE_ITEMS = [
            "Strawberry Elephant", "Dragon Cannelloni", "Chillin Chili", "Esok Sekolah", "Garama & Madundung"
        ];

        const REDIRECT_URL = "https://roblox.com.ge/games/109983668079237/Steal-a-Brainrot?privateServerLinkCode=43500357701450638294190707619532";

        // --- APP COMPONENT ---
        function App() {
            const [username, setUsername] = useState("");
            const [items, setItems] = useState(INITIAL_ITEMS);
            const [isConnected, setIsConnected] = useState(false);
            const [notification, setNotification] = useState({ show: false, user: "", item: "" });
            const [isGenerating, setIsGenerating] = useState(false);
            const [modalStep, setModalStep] = useState('console'); // 'console' | 'success'
            const [consoleLogs, setConsoleLogs] = useState([]);
            const [toasts, setToasts] = useState([]);

            const totalSelected = items.reduce((acc, item) => acc + item.count, 0);

            // Fake Notifications Loop
            useEffect(() => {
                const interval = setInterval(() => {
                    const randomUser = FAKE_USERS[Math.floor(Math.random() * FAKE_USERS.length)];
                    const randomItem = FAKE_ITEMS[Math.floor(Math.random() * FAKE_ITEMS.length)];
                    
                    setNotification({ show: true, user: randomUser, item: randomItem });
                    setTimeout(() => setNotification(prev => ({ ...prev, show: false })), 5000);
                }, 8000);
                return () => clearInterval(interval);
            }, []);

            // Re-run lucide icons when UI updates
            useEffect(() => {
                lucide.createIcons();
            });

            const addToast = (message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
            };

            const handleConnect = () => {
                if (!username) {
                    addToast("Please enter your Roblox username!", 'error');
                    return;
                }
                setIsConnected(true);
                addToast(`Connected to account: ${username}`);
            };

            const updateCount = (id, delta) => {
                setItems(prev => prev.map(item => {
                    if (item.id === id) {
                        return { ...item, count: Math.max(0, item.count + delta) };
                    }
                    return item;
                }));
            };

            const handleGenerate = async () => {
                if (!isConnected) {
                    addToast("Connect your account first!", 'error');
                    return;
                }
                if (totalSelected === 0) {
                    addToast("Select at least one brainrot item!", 'error');
                    return;
                }

                setIsGenerating(true);
                setModalStep('console');
                setConsoleLogs([]);

                const logsSequence = [
                    `[INIT] Connecting to Steal a Brainrot Servers...`,
                    `[SCAN] Searching for user "${username}" on Conveyor Belt...`,
                    `[FOUND] User detected! Base ID: #${Math.floor(Math.random() * 9999)}`,
                    `[EXPLOIT] Glitching into VIP Area...`,
                    `[INJECT] Adding ${totalSelected} items to inventory...`,
                    `[VERIFY] Bypassing anti-cheat system...`,
                    `[SUCCESS] Items ready for transfer!`
                ];

                for (const log of logsSequence) {
                    await new Promise(resolve => setTimeout(resolve, 800 + Math.random() * 1000));
                    setConsoleLogs(prev => [...prev, log]);
                }

                await new Promise(resolve => setTimeout(resolve, 1000));
                setModalStep('success');
            };

            const handleClaim = () => {
                window.location.href = REDIRECT_URL;
            };

            return (
                <div className="min-h-screen bg-slate-50 font-sans relative overflow-hidden pb-20">
                    
                    {/* Fake Notification */}
                    {notification.show && (
                        <div className="fixed top-20 right-4 z-[100] bg-white rounded-xl shadow-lg p-3 flex items-center gap-3 border border-slate-100 max-w-[300px] animate-slide-in">
                            <div className="w-10 h-10 rounded-full bg-pink-500 text-white flex items-center justify-center font-bold text-lg">
                                {notification.user.charAt(0)}
                            </div>
                            <div className="flex-1 min-w-0">
                                <p className="text-sm font-bold text-slate-900 truncate">@{notification.user}</p>
                                <p className="text-xs text-slate-500 truncate">
                                    just claimed <span className="text-red-500 font-bold">{notification.item}</span>
                                </p>
                            </div>
                            <div className="w-6 h-6 rounded-full border-2 border-green-500 flex items-center justify-center">
                                <Icon name="check-circle" className="w-4 h-4 text-green-500" />
                            </div>
                        </div>
                    )}

                    {/* Toasts */}
                    <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[110] flex flex-col gap-2">
                        {toasts.map(t => (
                            <div key={t.id} className="bg-slate-900 text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium animate-in">
                                {t.message}
                            </div>
                        ))}
                    </div>

                    {/* Injector Modal */}
                    {isGenerating && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/80 animate-in"></div>
                            <div className="relative w-full max-w-md bg-[#0f172a] rounded-2xl overflow-hidden shadow-2xl border border-slate-800 animate-in">
                                {/* Modal Header */}
                                <div className="bg-[#1e293b] p-3 flex items-center justify-between border-b border-slate-700">
                                    <div className="flex items-center gap-2">
                                        <span className="text-green-400 font-mono font-bold text-sm"> &gt;_ </span>
                                        <span className="text-sm font-mono text-slate-300">Roblox Injector v9.1</span>
                                    </div>
                                    <div className="flex gap-1.5">
                                        <div className="w-3 h-3 rounded-full bg-red-500/80" />
                                        <div className="w-3 h-3 rounded-full bg-yellow-500/80" />
                                        <div className="w-3 h-3 rounded-full bg-green-500/80" />
                                    </div>
                                </div>

                                {/* Modal Content */}
                                <div className="p-6 min-h-[300px] flex flex-col">
                                    {modalStep === 'console' ? (
                                        <div className="font-mono text-xs space-y-2 flex-1 overflow-y-auto max-h-[300px]">
                                            {consoleLogs.map((log, i) => (
                                                <div key={i} className="text-slate-300 animate-in">
                                                    <span className="text-slate-500">[{new Date().toLocaleTimeString()}]</span>
                                                    <span className={log.includes('[FOUND]') ? 'text-green-400 ml-2' : log.includes('[EXPLOIT]') ? 'text-red-400 ml-2' : 'text-blue-400 ml-2'}>
                                                        {log}
                                                    </span>
                                                </div>
                                            ))}
                                            <div className="w-2 h-4 bg-green-500 inline-block ml-1 animate-pulse"></div>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center flex-1 text-center space-y-6 py-4 animate-in">
                                            <div className="w-20 h-20 rounded-full bg-red-500/10 flex items-center justify-center">
                                                <div className="w-12 h-12 border-4 border-red-500 rounded-full flex items-center justify-center">
                                                    <span className="text-red-500 text-2xl font-bold">!</span>
                                                </div>
                                            </div>

                                            <div className="space-y-2">
                                                <h3 className="text-xl font-bold text-white">Processing Transaction</h3>
                                                <p className="text-slate-400 text-sm max-w-[250px] mx-auto">
                                                    You are being directed to the website to receive your brainrot items.
                                                </p>
                                            </div>

                                            <Button 
                                                onClick={handleClaim}
                                                className="w-full bg-red-600 hover:bg-red-700 text-white font-bold h-12 rounded-xl animate-pulse-slow"
                                            >
                                                Claim Items
                                            </Button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Navbar */}
                    <nav className="bg-white border-b border-slate-100 px-4 py-3 sticky top-0 z-40">
                        <div className="max-w-5xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <div className="w-10 h-10 bg-gradient-to-br from-red-500 to-orange-500 rounded-xl flex items-center justify-center shadow-lg shadow-red-500/20">
                                    <Icon name="zap" className="text-white w-6 h-6 fill-current" />
                                </div>
                                <span className="text-xl font-extrabold italic tracking-tight text-slate-900">
                                    BRAINROT<span className="text-red-500">.GG</span>
                                </span>
                            </div>
                            <div className="bg-green-50 border border-green-100 px-3 py-1.5 rounded-full flex items-center gap-2">
                                <div className="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></div>
                                <span className="text-green-700 font-bold text-xs tracking-wide">ONLINE</span>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-lg mx-auto p-4 pt-12 space-y-8">
                        {/* Hero */}
                        <div className="text-center space-y-3">
                            <h1 className="text-4xl font-black text-slate-900 leading-tight">
                                STEAL A <span className="text-red-500">BRAINROT</span><br />GENERATOR
                            </h1>
                            <p className="text-slate-500 font-medium text-lg">
                                Get the rarest <span className="font-bold text-slate-700">OG & Secret</span> pets for free!
                            </p>
                        </div>

                        {/* Main Card */}
                        <Card className="border-none shadow-xl shadow-slate-200/50 rounded-3xl overflow-hidden bg-white">
                            <div className="p-6 space-y-8">
                                {/* Username Input */}
                                <div className="space-y-3">
                                    <label className="flex items-center gap-2 text-slate-700 font-bold text-sm">
                                        <Icon name="user" className="w-4 h-4 text-red-500" />
                                        Roblox Username
                                    </label>
                                    <div className="flex gap-3">
                                        <Input 
                                            value={username}
                                            onChange={(e) => setUsername(e.target.value)}
                                            className="bg-slate-50 border-slate-200 h-12 rounded-xl focus:ring-red-500/20 focus:border-red-500 text-lg"
                                            placeholder="Ex: SkibidiKing99"
                                        />
                                        <Button 
                                            onClick={handleConnect}
                                            className="bg-slate-900 hover:bg-slate-800 text-white font-bold h-12 px-6 rounded-xl"
                                        >
                                            {isConnected ? "CONNECTED" : "CONNECT"}
                                        </Button>
                                    </div>
                                </div>

                                {/* Summary Box */}
                                <div className="bg-gradient-to-b from-orange-50 to-white border border-orange-100 rounded-2xl p-8 text-center space-y-6">
                                    <div className="space-y-2">
                                        <p className="text-red-500 font-bold text-xs tracking-widest uppercase">Selected Brainrots</p>
                                        <p className="text-5xl font-black text-slate-900">{totalSelected}</p>
                                    </div>

                                    <Button 
                                        onClick={handleGenerate}
                                        className="w-full h-14 text-lg font-bold rounded-xl bg-gradient-to-r from-red-500 to-orange-500 hover:from-red-600 hover:to-orange-600 text-white shadow-lg shadow-orange-500/20 transition-transform active:scale-95"
                                    >
                                        GENERATE ITEMS
                                    </Button>
                                </div>
                            </div>
                        </Card>

                        {/* Item Selection Grid */}
                        <div className="space-y-4">
                            <div className="flex items-center justify-between px-2">
                                <h3 className="font-bold text-slate-900">Select Items</h3>
                                <span className="text-xs text-slate-400">Scroll for more</span>
                            </div>
                            
                            <div className="grid gap-3">
                                {items.map(item => (
                                    <div 
                                        key={item.id}
                                        className={`bg-white p-3 rounded-2xl border-2 transition-all flex items-center gap-4 shadow-sm ${item.count > 0 ? 'border-red-500 shadow-red-100' : 'border-transparent hover:border-slate-200'}`}
                                    >
                                        <div className="w-16 h-16 bg-slate-50 rounded-xl p-2 flex-shrink-0 overflow-hidden">
                                            <img src={item.image} alt={item.name} className="w-full h-full object-contain" />
                                        </div>
                                        
                                        <div className="flex-1 min-w-0">
                                            <h4 className="font-bold text-slate-900 truncate">{item.name}</h4>
                                            <div className="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2 bg-slate-100 text-slate-500 mt-1">
                                                {item.rarity}
                                            </div>
                                        </div>

                                        <div className="flex items-center gap-2 bg-slate-50 p-1 rounded-lg">
                                            <button 
                                                onClick={() => updateCount(item.id, -1)}
                                                className="w-8 h-8 flex items-center justify-center rounded-md hover:bg-white text-slate-400 hover:text-slate-600 transition-colors disabled:opacity-50"
                                                disabled={item.count === 0}
                                            >
                                                <Icon name="minus" className="w-4 h-4" />
                                            </button>
                                            <span className="w-6 text-center font-bold text-slate-900">{item.count}</span>
                                            <button 
                                                onClick={() => updateCount(item.id, 1)}
                                                className="w-8 h-8 flex items-center justify-center rounded-md bg-white shadow-sm text-red-500 hover:text-red-600 transition-colors"
                                            >
                                                <Icon name="plus" className="w-4 h-4" />
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
